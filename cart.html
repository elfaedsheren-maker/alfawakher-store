<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلة | الفواخر</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Arial}
body{background:#fdfcf5;color:#2c2c2c;direction:rtl}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 5%;background:#1a4d2e;color:white;position:sticky;top:0;z-index:100}
.logo{font-weight:bold;font-size:22px}
.header nav{display:flex;gap:18px}
.nav-link{color:white;text-decoration:none;padding:8px 14px;border-radius:20px;transition:.3s}
.nav-link:hover,.nav-link.active{background:#f4b400;color:#1a4d2e}
.btn{background:#f4b400;color:#1a4d2e;padding:14px 28px;border:none;border-radius:30px;font-weight:bold;font-size:18px;cursor:pointer;text-decoration:none;display:inline-block;margin:8px}
.btn-whats{background:#25D366;color:white}
.section{padding:60px 5%}
.footer{background:#1a4d2e;color:white;text-align:center;padding:30px;margin-top:40px}
.form-box{max-width:600px;margin:20px auto;background:white;padding:20px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.08)}
.form-box input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
</style>
</head><body>

<header class="header">
  <div class="logo">🫒 الفواخر - زيتون فاخر</div>
  <nav>
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="products.html" class="nav-link">المنتجات</a>
    <a href="contact.html" class="nav-link">اتصل بنا</a>
    <a href="cart.html" class="nav-link">🛒 السلة <span id="cart-count">0</span></a>
  </nav>
</header>

<div class="section">
<h1 style="text-align:center;color:#1a4d2e">سلة المشتريات</h1>
<div id="cart-items" style="max-width:700px;margin:20px auto"></div>

<div class="form-box" id="order-form" style="display:none">
<h3 style="text-align:center;margin-bottom:15px;color:#1a4d2e">بيانات التوصيل</h3>
<input id="cust-name" placeholder="اسمك بالكامل *">
<input id="cust-phone" placeholder="رقم موبايلك *">
<input id="cust-address" placeholder="عنوانك بالتفصيل *">
</div>

<div style="text-align:center;margin-top:20px">
<button class="btn btn-whats" id="whatsapp-btn" onclick="sendToWhatsApp()">📲 إتمام الطلب واتساب</button>
<a href="products.html" class="btn" style="background:#ddd">كمل تسوق</a>
</div>
</div>

<div class="footer">© 2026 الفواخر - 01009379373</div>

<script>
const WHATSAPP_NUMBER = "201009379373";
let CART = JSON.parse(localStorage.getItem('olive_cart')||'[]');

function render(){
  let div=document.getElementById('cart-items');
  let form=document.getElementById('order-form');
  if(!CART.length){
    div.innerHTML='<p style=text-align:center>السلة فاضية 🛒<br><br><a href=products.html class=btn>شوف المنتجات</a></p>';
    form.style.display='none';
    return
  }
  form.style.display='block';
  let total=0;
  div.innerHTML=CART.map((it,i)=>{
    total+=it.price;
    return `<div style="display:flex;justify-content:space-between;background:white;padding:12px;margin:8px 0;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)"><span>${i+1}. ${it.name}</span><span>${it.price} جنيه <button onclick="removeItem(${i})" style="margin-right:10px;border:none;background:none;cursor:pointer">❌</button></span></div>`
  }).join('')+`<h3 style="text-align:center;margin-top:15px">الإجمالي: ${total} جنيه</h3>`;
  document.getElementById('cart-count').textContent=CART.length;
}

function removeItem(i){
  CART.splice(i,1);
  localStorage.setItem('olive_cart',JSON.stringify(CART));
  render();
}

function sendToWhatsApp(){
  if(!CART.length){alert('السلة فاضية');return}
  let name=document.getElementById('cust-name').value.trim();
  let phone=document.getElementById('cust-phone').value.trim();
  let address=document.getElementById('cust-address').value.trim();
  
  if(!name || !phone || !address){
    alert('من فضلك املى بيانات التوصيل (الاسم - الموبايل - العنوان)');
    return;
  }

  let total=0;
  let itemsText = CART.map((it,i)=>{
    total+=it.price;
    return `${i+1}. ${it.name} - ${it.price} جنيه`;
  }).join('\n');

  let message = `🫒 *طلب جديد من متجر الفواخر* 🫒\n\n`+
  `📦 *المنتجات:*\n${itemsText}\n\n`+
  `💰 *الإجمالي: ${total} جنيه*\n\n`+
  `👤 *بيانات العميل:*\n`+
  `الاسم: ${name}\n`+
  `الموبايل: ${phone}\n`+
  `العنوان: ${address}\n\n`+
  `أرجو تأكيد الطلب والتواصل معي`;

  let url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
}

render();
</script>
</body></html>
